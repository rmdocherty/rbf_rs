<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>hello-wasm example</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 40px auto;
        max-width: 800px;
        line-height: 1.6;
        font-size: 18px;
        color: #444;
        padding: 0 10px;
      }
      h1,
      h2,
      h3 {
        line-height: 1.2;
      }
      code {
        background: white;
      }
      a {
        border-bottom: 1px solid #444444;
        color: #444444;
        text-decoration: none;
      }
      canvas {
        object-fit: contain;
      }
      a:hover {
        border-bottom: 0;
      }
      canvas {
        width: 100% !important;
        height: auto !important;
      }
      .page-container {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 1em;
      }
      .slider-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 2em;
        margin-bottom: 1em;
      }
      .slider-group {
        display: flex;
        align-items: center;
        gap: 0.5em;
      }
      .image-upload-row {
        display: flex;
        align-items: center;
        gap: 0.5em;
      }
    </style>
  </head>
  <body>
    <div class="page-container">
      <h1>RBF</h1>
      <div class="image-upload-row">
        <label for="image-upload">Choose image</label>
        <input id="image-upload" type="file" accept="image/*" />
      </div>
      <div class="slider-row">
        <div class="slider-group">
          <label for="sigma-spatial">sigma spatial</label>
          <input id="sigma-spatial" type="range" min="0.001" max="0.1" step="0.001" value="0.01" />
          <span id="sigma-spatial-value">0.01</span>
        </div>
        <div class="slider-group">
          <label for="sigma-range">sigma range</label>
          <input id="sigma-range" type="range" min="0.001" max="0.5" step="0.001" value="0.05" />
          <span id="sigma-range-value">0.05</span>
        </div>
      </div>
      <div class="image-overlay-container">
        <img id="input" src="/public/summary.png" style="display: none" />
        <canvas id="output"></canvas>
      </div>
    </div>
    <script type="module" src="/index.js"></script>
  </body>
</html>
