<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>hello-wasm example</title>
    <style>
      :root {
        --mask-position: 50%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 40px auto;
        max-width: 650px;
        line-height: 1.6;
        font-size: 18px;
        color: #444;
        padding: 0 10px;
      }
      .page-container {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1em;
      }
      h1,
      h2,
      h3 {
        line-height: 1.2;
      }
      code {
        background: white;
      }
      a {
        border-bottom: 1px solid #444444;
        color: #444444;
        text-decoration: none;
      }
      a:hover {
        border-bottom: 0;
      }
      .slider-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 2em;
        margin-bottom: 1em;
      }
      .slider-group {
        display: flex;
        align-items: center;
        gap: 0.5em;
      }
      .image-overlay-container {
        position: relative;
        display: inline-block;
        margin-bottom: 1em;
      }
      #input {
        position: relative;
        display: block;
        z-index: 1;
      }
      #output {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        z-index: 2;
        pointer-events: none;
        -webkit-mask-image: linear-gradient(to right, black var(--mask-position), transparent var(--mask-position));
        mask-image: linear-gradient(to right, black var(--mask-position), transparent var(--mask-position));
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
      }
      .mask-slider-row {
        display: flex;
        align-items: center;
        gap: 0.5em;
      }
    </style>
  </head>
  <body>
    <div class="page-container">
      <div class="slider-row">
        <div class="slider-group">
          <label for="sigma-spatial">sigma spatial</label>
          <input id="sigma-spatial" type="range" min="0.001" max="0.1" step="0.001" value="0.01" />
          <span id="sigma-spatial-value">0.01</span>
        </div>
        <div class="slider-group">
          <label for="sigma-range">sigma range</label>
          <input id="sigma-range" type="range" min="0.001" max="0.2" step="0.001" value="0.05" />
          <span id="sigma-range-value">0.05</span>
        </div>
      </div>
      <div class="image-overlay-container">
        <img id="input" src="/public/summary.png" />
        <img id="output" />
      </div>
      <div class="mask-slider-row">
        <label for="mask-slider">Overlay boundary</label>
        <input id="mask-slider" type="range" min="0" max="100" value="50" />
        <span id="mask-slider-value">50%</span>
      </div>
    </div>
    <script type="module" src="/index.js"></script>
  </body>
</html>
